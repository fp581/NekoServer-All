services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    ports:
      - "${NEKO_BIND}:7878:7878"
    environment:
      PUID: "${NEKO_UID}"
      PGID: "${NEKO_GID}"
      TZ: "${NEKO_TZ}"
    volumes:
      - "${NEKO_DATA}/appdata/radarr:/config"
      - "${NEKO_MEDIA}/library:/data"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - neko-media
networks:
  neko-media:
    external: true
    name: nekoserver-media
