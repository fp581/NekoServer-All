name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_DIR: nekoserver
  # Pinned so lint results only change when this line does. The runtime itself is built
  # on the PC that installs NekoServer (install.sh), with the distribution's own Rust;
  # Cargo.toml's rust-version is the oldest that must still build it.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    defaults:
      run:
        working-directory: ${{ env.RELEASE_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test dependencies
        run: "python -m pip install --only-binary :all: --require-hashes -r .github/ci-requirements.txt"
        working-directory: .
      # The tests that exercise the runtime need one built from these sources, as a
      # server has after install.sh: built here the same way (and skipped where none is).
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.85"
      - name: Build the runtime for this PC
        run: python3 runtime/build.py
      - name: Compile every module
        run: python -m py_compile *.py modules/*.py
      - name: Lint (syntax errors and undefined names)
        # Pinned, so lint results only change when this line does.
        run: pipx run ruff==0.16.8 check --select E9,F63,F7,F82 --output-format github .
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  compose:
    name: Compose files
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.RELEASE_DIR }}
    env:
      NEKO_DATA: /srv/nekoserver
      NEKO_MEDIA: /mnt/nekoserver-media
      NEKO_UID: "1000"
      NEKO_GID: "1000"
      NEKO_TZ: UTC
      NEKO_BIND: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: docker compose config
        run: for f in compose/*.yaml; do echo "::group::$f"; docker compose -f "$f" config -q; echo "::endgroup::"; done

  rust:
    name: Rust runtime
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.RELEASE_DIR }}/runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test --locked
        # A failing test is also named as an annotation, readable without the full log.
        run: |
          set -o pipefail
          if ! cargo test --locked 2>&1 | tee "$RUNNER_TEMP/rust-tests.log"; then
            grep -E "^test .* FAILED$|panicked at|^thread '.*' panicked|assertion" "$RUNNER_TEMP/rust-tests.log" \
              | head -20 | sed 's/^/::error title=Rust test::/'
            exit 1
          fi

  build-runtime:
    # The runtime builds the way install.sh builds it on a server: with the oldest Rust
    # Cargo.toml allows (a distribution's own), for the PC itself; and the static release
    # way with the pinned toolchain and the musl target. Neither is committed: the binary
    # is made on the PC that installs NekoServer.
    name: Build runtime (${{ matrix.name }})
    needs: rust
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oldest Rust, this PC
            toolchain: "1.85"
            targets: ""
          - name: static release
            toolchain: "1.99.1"
            targets: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.targets }}
      - name: Build (writes bin/ and build.json)
        working-directory: ${{ env.RELEASE_DIR }}/runtime
        run: |
          python3 build.py
          python3 -c "import json; m = json.load(open('build.json')); print('target', m['target'], 'static', m['static'], 'version', m['version'])"
          ./bin/nekoserver-runtime --version
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        if: matrix.targets != ''
        with:
          name: nekoserver-runtime-static
          path: |
            ${{ env.RELEASE_DIR }}/runtime/bin/nekoserver-runtime
            ${{ env.RELEASE_DIR }}/runtime/build.json
