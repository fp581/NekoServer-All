name: CI

# CI runs once, when a pull request is opened (or reopened, or marked ready for
# review), not for every commit pushed to a branch or to a pull request after that.
# To check a pull request again after more commits: Actions -> CI -> Run workflow,
# on its branch (or: gh workflow run ci.yml --ref <branch>).
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_DIR: nekoserver
  # Pinned so lint results only change when this line does. The runtime itself is built
  # on the PC that installs NekoServer (install.sh), with the distribution's own Rust;
  # Cargo.toml's rust-version is the oldest that must still build it.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    defaults:
      run:
        working-directory: ${{ env.RELEASE_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test dependencies
        run: "python -m pip install --only-binary :all: --require-hashes -r .github/ci-requirements.txt"
        working-directory: .
      # The tests that exercise the runtime need one built from these sources, as a
      # server has after install.sh: built here the same way (and skipped where none is).
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.85"
      - name: Build the runtime for this PC
        run: python3 runtime/build.py
      - name: Compile every module
        run: python -m py_compile ./*.py ./modules/*.py
      - name: Lint (syntax errors and undefined names)
        # Pinned, so lint results only change when this line does.
        run: pipx run ruff==0.16.8 check --select E9,F63,F7,F82 --output-format github .
      - name: Layout of the Python (ruff.toml; `ruff format .` in this folder puts a file right)
        run: pipx run ruff==0.16.8 format --check .
      - name: Layout of the dashboard, the setup window and the shell scripts
        # Prettier (.prettierrc.json) and shfmt, pinned like ruff; `npx prettier@3.3.3 --write <file>`
        # and `shfmt -i 2 -ci -w <file>` put a file right.
        run: |
          npm install --prefix "$RUNNER_TEMP/prettier" --no-package-lock --no-audit --no-fund --ignore-scripts prettier@3.3.3
          "$RUNNER_TEMP/prettier/node_modules/.bin/prettier" --check "dashboard/*.{js,css,html}" "setup-gui/*.{js,css,html}"
          curl -sSf --proto '=https' --proto-redir '=https' -L https://github.com/mvdan/sh/releases/download/v3.7.0/shfmt_v3.7.0_linux_amd64 -o "$RUNNER_TEMP/shfmt"
          chmod +x "$RUNNER_TEMP/shfmt" && "$RUNNER_TEMP/shfmt" -i 2 -ci -d install.sh uninstall.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  browser:
    # The dashboard and the setup window in a real browser: the Python job above skips
    # the Playwright tests (it has no Playwright). The browser is pinned by
    # .github/browser-tests (package-lock.json: Playwright 1.48.2 and its Chromium build
    # 1140), the same as on the rig, which runs the same run.sh.
    name: Browser tests (Chromium 130)
    runs-on: ubuntu-24.04
    # Usually about 7 minutes (2 the runtime build, 1-2 the browser, 1-3 the tests).
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ${{ env.RELEASE_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "18.19.1"
      - name: Test dependencies
        run: "python -m pip install --only-binary :all: --require-hashes -r .github/ci-requirements.txt"
        working-directory: .
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.85"
      - name: Build the runtime for this PC
        run: python3 runtime/build.py
      - name: Playwright and its Chromium, pinned
        # The install fetches from apt and Playwright's download host. On 2026-11-23 apt-get
        # update stalled on archive.ubuntu.com for 18 minutes: apt now gives up on a silent
        # server after 30 s, and an install that still stalls is stopped after 3 minutes and
        # tried once more.
        timeout-minutes: 8
        run: |
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\n' |
            sudo tee /etc/apt/apt.conf.d/99neko-timeouts > /dev/null
          cp ../.github/browser-tests/package.json ../.github/browser-tests/package-lock.json "$RUNNER_TEMP/"
          npm ci --prefix "$RUNNER_TEMP" --no-audit --no-fund --ignore-scripts
          echo "NODE_PATH=$RUNNER_TEMP/node_modules" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers" >> "$GITHUB_ENV"
          for try in 1 2; do
            PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers" timeout 180 "$RUNNER_TEMP/node_modules/.bin/playwright" install --with-deps chromium && exit 0
            echo "::warning title=Playwright::install try $try stopped or failed"
            sudo pkill -x apt-get || true  # a stalled apt-get would hold apt's lock
            sudo dpkg --configure -a || true  # an install stopped halfway is finished first
          done
          exit 1
      - name: Browser tests
        # Each test also has its own limit (timed.py).
        timeout-minutes: 6
        run: bash ../.github/browser-tests/run.sh

  restore-tool:
    # neko_restore.py is copied onto every card to be run on whatever PC the card ends up
    # in, so it promises Python 3.8 or newer: its own tests run on 3.8 here, so a newer
    # feature slipping into it fails CI rather than a restore years later.
    name: Restore tool (Python 3.8)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.RELEASE_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
      - name: Python 3.8
        run: |
          python3 -m pip install --only-binary :all: --require-hashes -r ../.github/restore-tool-requirements.txt
          python3 -m uv python install 3.8
      - name: The restore tool's tests on Python 3.8
        run: $(python3 -m uv python find 3.8) -m unittest discover -s tests -p test_neko_restore.py -v

  compose:
    name: Compose files
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.RELEASE_DIR }}
    env:
      NEKO_DATA: /srv/nekoserver
      NEKO_MEDIA: /mnt/nekoserver-media
      NEKO_UID: "1000"
      NEKO_GID: "1000"
      NEKO_TZ: UTC
      NEKO_BIND: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: docker compose config
        run: for f in compose/*.yaml; do echo "::group::$f"; docker compose -f "$f" config -q; echo "::endgroup::"; done

  rust:
    name: Rust runtime
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.RELEASE_DIR }}/runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test --locked
        # A failing test is also named as an annotation, readable without the full log.
        run: |
          set -o pipefail
          if ! cargo test --locked 2>&1 | tee "$RUNNER_TEMP/rust-tests.log"; then
            grep -E "^test .* FAILED$|panicked at|^thread '.*' panicked|assertion" "$RUNNER_TEMP/rust-tests.log" \
              | head -20 | sed 's/^/::error title=Rust test::/'
            exit 1
          fi

  build-runtime:
    # The runtime builds the way install.sh builds it on a server: with the oldest Rust
    # Cargo.toml allows (a distribution's own), for the PC itself; and the static release
    # way with the pinned toolchain and the musl target. Neither is committed: the binary
    # is made on the PC that installs NekoServer.
    name: Build runtime (${{ matrix.name }})
    needs: rust
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oldest Rust, this PC
            toolchain: "1.85"
            targets: ""
          - name: static release
            toolchain: "1.99.1"
            targets: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.targets }}
      - name: A musl C compiler for the static build (SQLite, in the runtime, is C)
        if: matrix.targets != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build (writes bin/ and build.json)
        working-directory: ${{ env.RELEASE_DIR }}/runtime
        run: |
          python3 build.py
          python3 -c "import json; m = json.load(open('build.json')); print('target', m['target'], 'static', m['static'], 'version', m['version'])"
          # The static job must really be static: build.py falls back to this PC's own build
          # when something it needs (the musl C compiler, say) is missing.
          if [ -n "${{ matrix.targets }}" ]; then python3 -c "import json, sys; sys.exit(0 if json.load(open('build.json'))['static'] else 'not a static build')"; fi
          ./bin/nekoserver-runtime --version
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        if: matrix.targets != ''
        with:
          name: nekoserver-runtime-static
          path: |
            ${{ env.RELEASE_DIR }}/runtime/bin/nekoserver-runtime
            ${{ env.RELEASE_DIR }}/runtime/build.json
