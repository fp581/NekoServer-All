services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    ports:
      - "${NEKO_BIND}:8686:8686"
    environment:
      PUID: "${NEKO_UID}"
      PGID: "${NEKO_GID}"
      TZ: "${NEKO_TZ}"
    volumes:
      - "${NEKO_DATA}/appdata/lidarr:/config"
      # Single SSD mount: /data/downloads/music and /data/music share one
      # filesystem mount, so imports hardlink or move instead of copying.
      - "${NEKO_DATA}/library:/data"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - neko-media
networks:
  neko-media:
    external: true
    name: nekoserver-media
