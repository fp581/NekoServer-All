services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    ports:
      - "${NEKO_BIND}:5055:5055"
    environment:
      TZ: "${NEKO_TZ}"
      PORT: "5055"
    volumes:
      - "${NEKO_DATA}/appdata/seerr:/app/config"
    init: true
    user: "1000:1000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - neko-media
networks:
  neko-media:
    external: true
    name: nekoserver-media
