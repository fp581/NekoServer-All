services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    ports:
      - "${NEKO_BIND}:8096:8096"
    environment:
      PUID: "${NEKO_UID}"
      PGID: "${NEKO_GID}"
      TZ: "${NEKO_TZ}"
    volumes:
      - "${NEKO_DATA}/appdata/jellyfin:/config"
      - "${NEKO_MEDIA}/library/movies:/data/movies:ro"
      - "${NEKO_MEDIA}/library/tv:/data/tv:ro"
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - neko-media
networks:
  neko-media:
    external: true
    name: nekoserver-media
