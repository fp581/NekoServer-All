[package]
name = "nekoserver-runtime"
version = "0.52.3"
edition = "2021"
rust-version = "1.85"

[features]
# Development transport fixture only; never install this build.
test-fixtures = []

[dependencies]
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# serde_json's own traits (already built for it): the checksum ledger is read row by row.
serde_core = "1.0"
sha2 = "0.10"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
httparse = "1.10"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
