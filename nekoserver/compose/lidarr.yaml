services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    ports:
      - "${NEKO_BIND}:8686:8686"
    environment:
      PUID: "${NEKO_UID}"
      PGID: "${NEKO_GID}"
      TZ: "${NEKO_TZ}"
    volumes:
      - "${NEKO_DATA}/appdata/lidarr:/config"
      # Your files on a drive (or a share) of their own are bound in the long form with
      # create_host_path false: when the drive is away, Docker does not make the folder on
      # the disk Linux runs from, and this app does not start (drive-return starts it
      # once the drive is back).
      # One mount: /data/downloads/music and /data/music share one
      # filesystem mount, so imports hardlink or move instead of copying.
      - type: bind
        source: "${NEKO_MUSIC}/library"
        target: /data
        bind:
          create_host_path: false
      # Media you already have (existing_media.py): the folders setup mounts under
      # library/existing are seen at /data/existing/<kind>, the path Jellyfin and Navidrome
      # use. A mount of its own with rslave: a share that comes back, or a folder chosen
      # after this app started, is seen without a restart. Whether it can be written is
      # the mount's own setting (read-only unless new files are saved there).
      - type: bind
        source: "${NEKO_MUSIC}/library/existing"
        target: /data/existing
        bind:
          propagation: rslave
          create_host_path: false
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - neko-media
networks:
  neko-media:
    external: true
    name: nekoserver-media
