services:
  navidrome:
    image: deluan/navidrome:latest
    ports:
      - "${NEKO_BIND}:4533:4533"
    environment:
      ND_MUSICFOLDER: "/music"
      ND_DATAFOLDER: "/data"
      ND_SCANNER_SCHEDULE: "0 * * * *"
      ND_SCANNER_WATCHERWAIT: "10s"
      ND_ENABLESHARING: "false"
      TZ: "${NEKO_TZ}"
    volumes:
      - "${NEKO_DATA}/appdata/navidrome:/data"
      - "${NEKO_MUSIC}/library/music:/music:ro"
      # Media you already have, used where it is (existing_media.py): each folder is
      # mounted under library/existing by setup, and seen here as /data/existing/<kind>.
      # rslave: a share that comes back after this app started is seen without a restart.
      - type: bind
        source: "${NEKO_MUSIC}/library/existing"
        target: /data/existing
        read_only: true
        bind:
          propagation: rslave
          create_host_path: true
    user: "${NEKO_UID}:${NEKO_GID}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - neko-media
networks:
  neko-media:
    external: true
    name: nekoserver-media
