services:
  navidrome:
    image: deluan/navidrome:latest
    ports:
      - "${NEKO_BIND}:4533:4533"
    environment:
      ND_MUSICFOLDER: "/music"
      ND_DATAFOLDER: "/data"
      ND_SCANNER_SCHEDULE: "0 * * * *"
      ND_SCANNER_WATCHERWAIT: "10s"
      ND_ENABLESHARING: "false"
      TZ: "${NEKO_TZ}"
    volumes:
      - "${NEKO_DATA}/appdata/navidrome:/data"
      # Your files on a drive (or a share) of their own are bound in the long form with
      # create_host_path false: when the drive is away, Docker does not make the folder on
      # the disk Linux runs from, and this app does not start (drive-return starts it
      # once the drive is back).
      - type: bind
        source: "${NEKO_MUSIC}/library/music"
        target: /music
        read_only: true
        bind:
          create_host_path: false
      # Media you already have, used where it is (existing_media.py): each folder is
      # mounted under library/existing by setup, and seen here as /data/existing/<kind>.
      # rslave: a share that comes back after this app started is seen without a restart.
      - type: bind
        source: "${NEKO_MUSIC}/library/existing"
        target: /data/existing
        read_only: true
        bind:
          propagation: rslave
          create_host_path: false
    user: "${NEKO_UID}:${NEKO_GID}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - neko-media
networks:
  neko-media:
    external: true
    name: nekoserver-media
