services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      PUID: "${NEKO_UID}"
      PGID: "${NEKO_GID}"
      TZ: "${NEKO_TZ}"
      WEBUI_PORT: "8080"
    ports:
      - "${NEKO_BIND}:8080:8080"
    volumes:
      - "${NEKO_DATA}/appdata/qbittorrent:/config"
      - "${NEKO_MEDIA}/library:/data"
      - "${NEKO_MUSIC}/library/downloads/music:/data/downloads/music"
      # Media you already have (existing_media.py): the folders setup mounts under
      # library/existing are seen at /data/existing/<kind>, the path Jellyfin and Navidrome
      # use. A mount of its own with rslave: a share that comes back, or a folder chosen
      # after this app started, is seen without a restart. Whether it can be written is
      # the mount's own setting (read-only unless new files are saved there).
      - type: bind
        source: "${NEKO_MEDIA}/library/existing"
        target: /data/existing
        bind:
          propagation: rslave
          create_host_path: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - neko-media
networks:
  neko-media:
    external: true
    name: nekoserver-media
