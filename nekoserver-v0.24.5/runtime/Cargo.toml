[package]
name = "nekoserver-runtime"
version = "0.24.5"
edition = "2021"
rust-version = "1.85"

[features]
# Development transport fixture only; never install this build.
test-fixtures = []

[dependencies]
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
httparse = "1.10"
regex = "1.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
